<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de pedido · Mi Mundo de Juguetes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], display: ['Fredoka', 'system-ui', 'sans-serif'] },
          colors: {
            fucsia: { 50:'#fdf2f8',100:'#fce7f3',200:'#fbcfe8',300:'#f9a8d4',400:'#f472b6',500:'#ec4899',600:'#db2777',700:'#be185d',800:'#9d174d',900:'#831843' },
            sol: { 50:'#fffbeb',100:'#fef3c7',200:'#fde68a',300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706',700:'#b45309',800:'#92400e',900:'#78350f' },
            turquesa: { 50:'#ecfeff',100:'#cffafe',200:'#a5f3fc',300:'#67e8f9',400:'#22d3ee',500:'#06b6d4',600:'#0891b2',700:'#0e7490',800:'#155e75',900:'#164e63' },
            lima: { 50:'#f7fee7',100:'#ecfccb',200:'#d9f99d',300:'#bef264',400:'#a3e635',500:'#84cc16',600:'#65a30d',700:'#4d7c0f',800:'#3f6212',900:'#365314' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen flex flex-col">
  <div data-header></div>

  <main class="flex-1 container-page py-8 md:py-12">
    <div id="pedidoContainer"></div>
  </main>

  <div data-footer></div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
  <script>
    if (!Auth.estaLogueado()) {
      window.location.href = 'login.html?redirect=pedido.html';
    }

    const pedidoId = UI.getQuery('id');
    const pedido = Storage.get(KEYS.PEDIDOS, []).find(p => p.id === pedidoId);
    const usuario = Auth.usuarioActual();

    if (!pedido || pedido.usuarioId !== usuario.id) {
      document.getElementById('pedidoContainer').innerHTML = `
        <div class="card p-12 text-center max-w-xl mx-auto">
          <div class="text-7xl mb-4">😕</div>
          <h2 class="font-display text-2xl font-bold text-fucsia-900 mb-3">Pedido no encontrado</h2>
          <p class="text-gray-600 mb-6">No encontramos este pedido o no te pertenece.</p>
          <a href="perfil.html" class="btn-primary">Ir a mi perfil</a>
        </div>
      `;
    } else {
      document.title = `Pedido ${pedido.id} · Mi Mundo de Juguetes`;
      const resenas = Storage.get(KEYS.RESENAS, []);
      const estados = ['Confirmado', 'Preparando', 'En camino', 'Entregado'];
      const estadoIdx = estados.indexOf(
        pedido.estado === 'entregado' ? 'Entregado' :
        pedido.estado === 'en-camino' ? 'En camino' :
        pedido.estado === 'preparando' ? 'Preparando' : 'Confirmado'
      );

      document.getElementById('pedidoContainer').innerHTML = `
        <nav class="text-sm text-gray-600 mb-3">
          <a href="perfil.html" class="hover:text-fucsia-700">Mi perfil</a>
          <span class="mx-2">/</span>
          <a href="perfil.html#pedidos" class="hover:text-fucsia-700">Mis pedidos</a>
          <span class="mx-2">/</span>
          <span class="text-fucsia-800 font-medium">${pedido.id}</span>
        </nav>

        <div class="flex flex-col md:flex-row md:items-end justify-between gap-3 mb-8">
          <div>
            <h1 class="font-display text-3xl md:text-4xl font-bold text-fucsia-900 mb-2">Pedido ${pedido.id}</h1>
            <p class="text-gray-600">Realizado el ${UI.formatFecha(pedido.fecha)}</p>
          </div>
          ${UI.badgeEstado(pedido.estado)}
        </div>

        <div class="grid lg:grid-cols-[1fr_360px] gap-8">
          <div class="space-y-6">
            <!-- STEPPER -->
            <section class="card p-6">
              <h2 class="font-display font-bold text-lg text-fucsia-900 mb-6">Estado del envío</h2>
              <div class="flex items-start justify-between gap-2">
                ${estados.map((estado, idx) => {
                  const stepData = pedido.seguimiento.find(s => s.estado === estado);
                  const active = idx <= estadoIdx;
                  const completed = idx < estadoIdx;
                  return `
                    <div class="stepper-dot ${active ? 'active' : ''} ${completed ? 'completed' : ''} flex-1">
                      <div class="dot">${completed ? '✓' : idx + 1}</div>
                      <p class="text-xs font-bold text-center mt-2 ${active ? 'text-fucsia-700' : 'text-gray-400'}">${estado}</p>
                      ${stepData ? `<p class="text-[10px] text-gray-500 text-center mt-1">${UI.formatFecha(stepData.fecha)}</p>` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            </section>

            <!-- PRODUCTOS -->
            <section class="card p-6">
              <h2 class="font-display font-bold text-lg text-fucsia-900 mb-4">Productos (${pedido.items.length})</h2>
              <div class="space-y-4">
                ${pedido.items.map(item => {
                  const yaReseno = resenas.some(r => r.productoId === item.productoId && r.usuarioId === usuario.id);
                  return `
                    <div class="flex items-start gap-4 pb-4 border-b border-gray-100 last:border-0 last:pb-0">
                      <a href="producto.html?id=${item.productoId}"><img src="${item.imagen}" alt="${item.nombre}" class="w-20 h-20 object-cover rounded-xl"></a>
                      <div class="flex-1">
                        <a href="producto.html?id=${item.productoId}" class="font-semibold text-gray-800 hover:text-fucsia-700 line-clamp-2">${item.nombre}</a>
                        <p class="text-sm text-gray-500 mt-1">Cant: ${item.cantidad} · ${UI.formatCLP(item.precio)} c/u</p>
                        ${pedido.estado === 'entregado' ? `
                          <div class="mt-2">
                            ${yaReseno ? `
                              <span class="text-xs text-lima-700 font-semibold flex items-center gap-1">
                                <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/></svg>
                                Reseña enviada
                              </span>
                            ` : `
                              <a href="resena.html?producto=${item.productoId}" class="text-xs bg-sol-100 text-sol-800 font-semibold px-3 py-1 rounded-full hover:bg-sol-200 transition inline-flex items-center gap-1">
                                <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                                Dejar reseña
                              </a>
                            `}
                          </div>
                        ` : ''}
                      </div>
                      <p class="font-bold text-fucsia-700 whitespace-nowrap">${UI.formatCLP(item.precio * item.cantidad)}</p>
                    </div>
                  `;
                }).join('')}
              </div>
            </section>
          </div>

          <!-- RESUMEN -->
          <aside class="lg:sticky lg:top-24 lg:self-start">
            <div class="card p-6 space-y-5">
              <div>
                <h3 class="font-display font-bold text-lg text-fucsia-900 mb-3">Información de envío</h3>
                <p class="text-sm text-gray-700">${pedido.direccion}</p>
                <p class="text-xs text-gray-500 mt-1">${pedido.envioTipo}</p>
              </div>
              <div class="pt-4 border-t border-gray-200">
                <h3 class="font-display font-bold text-lg text-fucsia-900 mb-3">Pago</h3>
                <p class="text-sm text-gray-700">${pedido.pago}</p>
              </div>
              <div class="pt-4 border-t border-gray-200 space-y-2 text-sm">
                <div class="flex justify-between"><span class="text-gray-600">Subtotal</span><span class="font-semibold">${UI.formatCLP(pedido.subtotal)}</span></div>
                <div class="flex justify-between"><span class="text-gray-600">Envío</span><span class="font-semibold">${pedido.envio === 0 ? 'Gratis' : UI.formatCLP(pedido.envio)}</span></div>
                <div class="flex justify-between items-center pt-2 border-t border-gray-200 mt-3">
                  <span class="font-display font-bold text-fucsia-900">Total</span>
                  <span class="font-display text-2xl font-bold text-fucsia-700">${UI.formatCLP(pedido.total)}</span>
                </div>
              </div>
              <a href="perfil.html" class="btn-secondary w-full justify-center text-sm">← Volver a mis pedidos</a>
            </div>
          </aside>
        </div>
      `;
    }
  </script>
</body>
</html>
