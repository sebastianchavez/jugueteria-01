<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Producto · Mi Mundo de Juguetes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], display: ['Fredoka', 'system-ui', 'sans-serif'] },
          colors: {
            fucsia: { 50:'#fdf2f8',100:'#fce7f3',200:'#fbcfe8',300:'#f9a8d4',400:'#f472b6',500:'#ec4899',600:'#db2777',700:'#be185d',800:'#9d174d',900:'#831843' },
            sol: { 50:'#fffbeb',100:'#fef3c7',200:'#fde68a',300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706',700:'#b45309',800:'#92400e',900:'#78350f' },
            turquesa: { 50:'#ecfeff',100:'#cffafe',200:'#a5f3fc',300:'#67e8f9',400:'#22d3ee',500:'#06b6d4',600:'#0891b2',700:'#0e7490',800:'#155e75',900:'#164e63' },
            lima: { 50:'#f7fee7',100:'#ecfccb',200:'#d9f99d',300:'#bef264',400:'#a3e635',500:'#84cc16',600:'#65a30d',700:'#4d7c0f',800:'#3f6212',900:'#365314' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen flex flex-col">
  <div data-header></div>

  <main class="flex-1" id="productoContainer"></main>

  <div data-footer></div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
  <script>
    const productoId = UI.getQuery('id');
    const producto = PRODUCTOS.find(p => p.id === productoId);

    if (!producto) {
      document.getElementById('productoContainer').innerHTML = `
        <section class="container-page py-20 text-center">
          <div class="text-7xl mb-4">😕</div>
          <h1 class="font-display text-3xl font-bold text-fucsia-900 mb-3">Producto no encontrado</h1>
          <p class="text-gray-600 mb-6">El producto que buscas no existe o fue removido del catálogo.</p>
          <a href="productos.html" class="btn-primary">Ver catálogo</a>
        </section>
      `;
    } else {
      document.title = `${producto.nombre} · Mi Mundo de Juguetes`;
      const todasResenas = Storage.get(KEYS.RESENAS, []);
      const resenas = todasResenas.filter(r => r.productoId === producto.id);
      const descuento = producto.precioAnterior ? Math.round((1 - producto.precio / producto.precioAnterior) * 100) : 0;
      const relacionados = PRODUCTOS.filter(p => p.categoria === producto.categoria && p.id !== producto.id).slice(0, 4);

      const puedeResenar = Auth.estaLogueado() ? (() => {
        const usuario = Auth.usuarioActual();
        const pedidos = Storage.get(KEYS.PEDIDOS, []).filter(p => p.usuarioId === usuario.id);
        const yaReseno = resenas.some(r => r.usuarioId === usuario.id);
        return pedidos.some(ped => ped.items.some(i => i.productoId === producto.id)) && !yaReseno;
      })() : false;

      const promedioRating = resenas.length > 0 ? (resenas.reduce((acc, r) => acc + r.rating, 0) / resenas.length).toFixed(1) : producto.rating;

      document.getElementById('productoContainer').innerHTML = `
        <section class="bg-gradient-to-b from-fucsia-50/40 to-white py-8">
          <div class="container-page">
            <nav class="text-sm text-gray-600 mb-6">
              <a href="index.html" class="hover:text-fucsia-700">Inicio</a>
              <span class="mx-2">/</span>
              <a href="productos.html" class="hover:text-fucsia-700">Productos</a>
              <span class="mx-2">/</span>
              <a href="productos.html?cat=${producto.categoria}" class="hover:text-fucsia-700">${UI.nombreCategoria(producto.categoria)}</a>
              <span class="mx-2">/</span>
              <span class="text-fucsia-800 font-medium">${producto.nombre}</span>
            </nav>

            <div class="grid md:grid-cols-2 gap-10 lg:gap-14">
              <!-- IMAGEN -->
              <div class="relative">
                <div class="absolute -top-4 -left-4 w-40 h-40 bg-sol-300 rounded-full blur-3xl opacity-40"></div>
                <div class="relative aspect-square rounded-3xl overflow-hidden shadow-2xl bg-gradient-to-br from-fucsia-50 to-sol-50">
                  <img src="${producto.imagen}" alt="${producto.nombre}" class="w-full h-full object-cover">
                </div>
                ${descuento > 0 ? `<div class="absolute top-4 left-4 bg-fucsia-700 text-white text-sm font-bold px-3 py-1.5 rounded-full shadow-lg">-${descuento}% DCTO</div>` : ''}
                ${producto.stock < 10 && producto.stock > 0 ? `<div class="absolute top-4 right-4 bg-sol-500 text-fucsia-900 text-xs font-bold px-3 py-1.5 rounded-full shadow-lg">¡Solo ${producto.stock} disponibles!</div>` : ''}
              </div>

              <!-- INFO -->
              <div>
                <p class="section-subtitle mb-2">${UI.nombreCategoria(producto.categoria)}</p>
                <h1 class="font-display text-3xl md:text-5xl font-bold text-fucsia-900 mb-3">${producto.nombre}</h1>
                <p class="text-sm text-gray-500 mb-4">Marca: <span class="font-semibold text-fucsia-700">${producto.marca}</span></p>

                <div class="flex items-center gap-4 mb-6">
                  ${UI.renderStars(promedioRating)}
                  <span class="text-sm text-gray-600">${promedioRating} · (${resenas.length} reseñas)</span>
                </div>

                <div class="flex items-end gap-3 mb-6">
                  <p class="font-display text-4xl md:text-5xl font-bold text-fucsia-700">${UI.formatCLP(producto.precio)}</p>
                  ${producto.precioAnterior ? `<p class="text-xl text-gray-400 line-through mb-1">${UI.formatCLP(producto.precioAnterior)}</p>` : ''}
                </div>

                <div class="flex flex-wrap gap-2 mb-6">
                  <span class="inline-flex items-center gap-1 px-3 py-1 bg-turquesa-100 text-turquesa-800 text-xs font-bold rounded-full">
                    👶 ${UI.nombreEdad(producto.edadMin, producto.edadMax)}
                  </span>
                  <span class="inline-flex items-center gap-1 px-3 py-1 bg-lima-100 text-lima-800 text-xs font-bold rounded-full">
                    ✓ ${producto.stock > 0 ? 'En stock' : 'Agotado'}
                  </span>
                </div>

                <p class="text-gray-700 mb-6 leading-relaxed">${producto.descripcion}</p>

                <!-- CANTIDAD + AGREGAR -->
                <div class="bg-white border-2 border-fucsia-100 rounded-2xl p-5 mb-6">
                  <div class="flex items-center gap-4">
                    <div class="flex items-center border-2 border-fucsia-200 rounded-xl overflow-hidden">
                      <button id="qtyMinus" class="px-4 py-3 hover:bg-fucsia-50 transition text-fucsia-700 font-bold">−</button>
                      <input id="qtyInput" type="number" min="1" max="${producto.stock}" value="1" class="w-16 text-center border-0 focus:outline-none font-bold text-fucsia-900">
                      <button id="qtyPlus" class="px-4 py-3 hover:bg-fucsia-50 transition text-fucsia-700 font-bold">+</button>
                    </div>
                    <button id="addToCart" class="btn-primary flex-1" ${producto.stock === 0 ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                      Agregar al carrito
                    </button>
                  </div>
                </div>

                <div class="grid grid-cols-3 gap-2 text-xs text-gray-600">
                  <div class="flex flex-col items-center gap-1 p-3 bg-fucsia-50 rounded-xl">
                    <span class="text-xl">🚚</span>
                    <span class="font-semibold">Envío 24-48h</span>
                  </div>
                  <div class="flex flex-col items-center gap-1 p-3 bg-sol-50 rounded-xl">
                    <span class="text-xl">🛡️</span>
                    <span class="font-semibold">Seguro y certificado</span>
                  </div>
                  <div class="flex flex-col items-center gap-1 p-3 bg-lima-50 rounded-xl">
                    <span class="text-xl">↩️</span>
                    <span class="font-semibold">10 días para devolver</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- RESEÑAS -->
        <section class="py-16 bg-white">
          <div class="container-page max-w-5xl">
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-3 mb-8">
              <div>
                <p class="section-subtitle">Opiniones</p>
                <h2 class="font-display text-3xl font-bold text-fucsia-900">Reseñas de clientes</h2>
              </div>
              ${puedeResenar ? `<a href="resena.html?producto=${producto.id}" class="btn-gold">⭐ Dejar reseña</a>` : ''}
            </div>

            ${resenas.length === 0 ? `
              <div class="card p-10 text-center">
                <div class="text-5xl mb-3">💭</div>
                <p class="text-gray-600">Este producto aún no tiene reseñas. ${Auth.estaLogueado() ? '¡Compra este producto y sé el primero en opinar!' : ''}</p>
              </div>
            ` : `
              <div class="space-y-4">
                ${resenas.map(r => `
                  <div class="card p-6">
                    <div class="flex items-start gap-4">
                      <img src="${r.usuarioAvatar}" alt="${r.usuarioNombre}" class="w-12 h-12 rounded-full object-cover flex-shrink-0">
                      <div class="flex-1">
                        <div class="flex items-center justify-between mb-1 flex-wrap gap-2">
                          <p class="font-bold text-fucsia-900">${r.usuarioNombre}</p>
                          ${UI.renderStars(r.rating, 'text-sm')}
                        </div>
                        <p class="text-xs text-gray-500 mb-2">${UI.formatFecha(r.fecha)}</p>
                        <h4 class="font-semibold text-gray-800 mb-1">${r.titulo}</h4>
                        <p class="text-gray-700 text-sm leading-relaxed">${r.comentario}</p>
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        </section>

        ${relacionados.length > 0 ? `
          <section class="py-16 bg-gradient-to-b from-fucsia-50/30 to-white">
            <div class="container-page">
              <h2 class="font-display text-2xl md:text-3xl font-bold text-fucsia-900 mb-8">También te puede interesar</h2>
              <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
                ${relacionados.map(p => UI.renderProductoCard(p)).join('')}
              </div>
            </div>
          </section>
        ` : ''}
      `;

      const qtyInput = document.getElementById('qtyInput');
      document.getElementById('qtyMinus').addEventListener('click', () => {
        qtyInput.value = Math.max(1, parseInt(qtyInput.value) - 1);
      });
      document.getElementById('qtyPlus').addEventListener('click', () => {
        qtyInput.value = Math.min(producto.stock, parseInt(qtyInput.value) + 1);
      });
      document.getElementById('addToCart').addEventListener('click', () => {
        const cant = parseInt(qtyInput.value);
        const result = Cart.agregar(producto.id, cant);
        if (result.ok) {
          UI.toast(`¡${producto.nombre} agregado al carrito! 🎉`, 'success');
        }
      });
    }
  </script>
</body>
</html>
