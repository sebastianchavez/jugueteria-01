<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta · Mi Mundo de Juguetes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], display: ['Fredoka', 'system-ui', 'sans-serif'] },
          colors: {
            fucsia: { 50:'#fdf2f8',100:'#fce7f3',200:'#fbcfe8',300:'#f9a8d4',400:'#f472b6',500:'#ec4899',600:'#db2777',700:'#be185d',800:'#9d174d',900:'#831843' },
            sol: { 50:'#fffbeb',100:'#fef3c7',200:'#fde68a',300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706',700:'#b45309',800:'#92400e',900:'#78350f' },
            turquesa: { 50:'#ecfeff',100:'#cffafe',200:'#a5f3fc',300:'#67e8f9',400:'#22d3ee',500:'#06b6d4',600:'#0891b2',700:'#0e7490',800:'#155e75',900:'#164e63' },
            lima: { 50:'#f7fee7',100:'#ecfccb',200:'#d9f99d',300:'#bef264',400:'#a3e635',500:'#84cc16',600:'#65a30d',700:'#4d7c0f',800:'#3f6212',900:'#365314' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen flex flex-col">
  <div data-header></div>

  <main class="flex-1 flex items-center justify-center py-12 px-4 hero-gradient">
    <div class="w-full max-w-2xl">
      <div class="bg-white rounded-3xl shadow-2xl p-8 md:p-10 border border-fucsia-100">
        <div class="text-center mb-8">
          <div class="inline-block bg-gradient-to-br from-fucsia-100 to-sol-100 rounded-full p-4 mb-4">
            <span class="text-5xl">🎁</span>
          </div>
          <h1 class="font-display text-3xl font-bold text-fucsia-900 mb-2">Crea tu cuenta</h1>
          <p class="text-gray-600">Únete a la familia y obtén beneficios exclusivos</p>
        </div>

        <form id="registroForm" class="space-y-4">
          <div>
            <label for="nombre" class="form-label">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" required minlength="3" placeholder="Juan Pérez" class="input-field">
          </div>

          <div class="grid md:grid-cols-2 gap-4">
            <div>
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" name="email" required placeholder="tu@email.com" class="input-field">
            </div>
            <div>
              <label for="telefono" class="form-label">Teléfono (opcional)</label>
              <input type="tel" id="telefono" name="telefono" placeholder="+56 9 1234 5678" class="input-field">
            </div>
          </div>

          <div class="grid md:grid-cols-2 gap-4">
            <div>
              <label for="password" class="form-label">Contraseña</label>
              <input type="password" id="password" name="password" required minlength="6" placeholder="Mínimo 6 caracteres" class="input-field">
            </div>
            <div>
              <label for="password2" class="form-label">Repetir contraseña</label>
              <input type="password" id="password2" name="password2" required minlength="6" placeholder="Confirma tu contraseña" class="input-field">
            </div>
          </div>

          <div>
            <label for="direccion" class="form-label">Dirección (opcional)</label>
            <input type="text" id="direccion" name="direccion" placeholder="Calle, número, depto" class="input-field">
          </div>

          <div class="grid md:grid-cols-2 gap-4">
            <div>
              <label for="comuna" class="form-label">Comuna (opcional)</label>
              <input type="text" id="comuna" name="comuna" placeholder="Providencia" class="input-field">
            </div>
            <div>
              <label for="region" class="form-label">Región (opcional)</label>
              <input type="text" id="region" name="region" placeholder="Región Metropolitana" class="input-field">
            </div>
          </div>

          <label class="flex items-start gap-2 cursor-pointer text-sm">
            <input type="checkbox" required class="mt-1 rounded text-fucsia-600 focus:ring-fucsia-500">
            <span class="text-gray-600">Acepto los <a href="terminos.html" class="text-fucsia-700 hover:underline font-semibold">Términos y Condiciones</a> y la <a href="privacidad.html" class="text-fucsia-700 hover:underline font-semibold">Política de Privacidad</a></span>
          </label>

          <button type="submit" class="btn-primary w-full justify-center">
            Crear mi cuenta
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
          </button>
        </form>

        <p class="text-center text-gray-600 mt-6 text-sm">
          ¿Ya tienes cuenta? <a href="login.html" class="text-fucsia-700 hover:text-fucsia-800 font-semibold">Inicia sesión</a>
        </p>
      </div>
    </div>
  </main>

  <div data-footer></div>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
  <script>
    const form = document.getElementById('registroForm');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const pwd = document.getElementById('password').value;
      const pwd2 = document.getElementById('password2').value;
      if (pwd !== pwd2) {
        UI.toast('Las contraseñas no coinciden.', 'error');
        return;
      }
      const datos = {
        nombre: document.getElementById('nombre').value,
        email: document.getElementById('email').value,
        telefono: document.getElementById('telefono').value,
        password: pwd,
        direccion: document.getElementById('direccion').value,
        comuna: document.getElementById('comuna').value,
        region: document.getElementById('region').value
      };
      const resultado = Auth.registrar(datos);
      if (resultado.ok) {
        UI.toast('¡Cuenta creada con éxito! Bienvenido/a 🎉', 'success');
        setTimeout(() => window.location.href = 'index.html', 1000);
      } else {
        UI.toast(resultado.error, 'error');
      }
    });
  </script>
</body>
</html>
