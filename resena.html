<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dejar Reseña · Mi Mundo de Juguetes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], display: ['Fredoka', 'system-ui', 'sans-serif'] },
          colors: {
            fucsia: { 50:'#fdf2f8',100:'#fce7f3',200:'#fbcfe8',300:'#f9a8d4',400:'#f472b6',500:'#ec4899',600:'#db2777',700:'#be185d',800:'#9d174d',900:'#831843' },
            sol: { 50:'#fffbeb',100:'#fef3c7',200:'#fde68a',300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706',700:'#b45309',800:'#92400e',900:'#78350f' },
            turquesa: { 50:'#ecfeff',100:'#cffafe',200:'#a5f3fc',300:'#67e8f9',400:'#22d3ee',500:'#06b6d4',600:'#0891b2',700:'#0e7490',800:'#155e75',900:'#164e63' },
            lima: { 50:'#f7fee7',100:'#ecfccb',200:'#d9f99d',300:'#bef264',400:'#a3e635',500:'#84cc16',600:'#65a30d',700:'#4d7c0f',800:'#3f6212',900:'#365314' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen flex flex-col">
  <div data-header></div>

  <main class="flex-1 container-page py-8 md:py-12 max-w-2xl">
    <div id="resenaContainer"></div>
  </main>

  <div data-footer></div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
  <script>
    if (!Auth.estaLogueado()) {
      window.location.href = 'login.html?redirect=resena.html';
    }

    const productoId = UI.getQuery('producto');
    const producto = PRODUCTOS.find(p => p.id === productoId);
    const usuario = Auth.usuarioActual();

    if (!producto) {
      document.getElementById('resenaContainer').innerHTML = `
        <div class="card p-12 text-center">
          <div class="text-7xl mb-4">😕</div>
          <h2 class="font-display text-2xl font-bold text-fucsia-900 mb-3">Producto no encontrado</h2>
          <a href="productos.html" class="btn-primary">Ver catálogo</a>
        </div>
      `;
    } else {
      // Verificar que compró el producto
      const pedidos = Storage.get(KEYS.PEDIDOS, []).filter(p => p.usuarioId === usuario.id && p.estado === 'entregado');
      const haComprado = pedidos.some(ped => ped.items.some(i => i.productoId === producto.id));

      if (!haComprado) {
        document.getElementById('resenaContainer').innerHTML = `
          <div class="card p-12 text-center">
            <div class="text-7xl mb-4">🔒</div>
            <h2 class="font-display text-2xl font-bold text-fucsia-900 mb-3">No puedes dejar reseña</h2>
            <p class="text-gray-600 mb-6">Solo puedes dejar reseñas de productos que hayas comprado y recibido.</p>
            <a href="producto.html?id=${producto.id}" class="btn-primary">Ver producto</a>
          </div>
        `;
      } else {
        // Verificar si ya reseñó
        const resenas = Storage.get(KEYS.RESENAS, []);
        const yaReseno = resenas.some(r => r.productoId === producto.id && r.usuarioId === usuario.id);

        if (yaReseno) {
          document.getElementById('resenaContainer').innerHTML = `
            <div class="card p-12 text-center">
              <div class="text-7xl mb-4">✅</div>
              <h2 class="font-display text-2xl font-bold text-fucsia-900 mb-3">Ya dejaste una reseña</h2>
              <p class="text-gray-600 mb-6">Gracias por compartir tu opinión sobre este producto.</p>
              <a href="producto.html?id=${producto.id}" class="btn-primary">Ver producto</a>
            </div>
          `;
        } else {
          document.getElementById('resenaContainer').innerHTML = `
            <nav class="text-sm text-gray-600 mb-3">
              <a href="perfil.html" class="hover:text-fucsia-700">Mi perfil</a>
              <span class="mx-2">/</span>
              <a href="producto.html?id=${producto.id}" class="hover:text-fucsia-700">${producto.nombre}</a>
              <span class="mx-2">/</span>
              <span class="text-fucsia-800 font-medium">Dejar reseña</span>
            </nav>

            <div class="card p-6 md:p-10">
              <div class="text-center mb-8">
                <div class="inline-block bg-gradient-to-br from-sol-100 to-fucsia-100 rounded-full p-4 mb-3">
                  <span class="text-5xl">⭐</span>
                </div>
                <h1 class="font-display text-3xl font-bold text-fucsia-900 mb-2">¿Qué te pareció?</h1>
                <p class="text-gray-600">Tu opinión ayuda a otras familias</p>
              </div>

              <!-- Producto -->
              <div class="flex items-center gap-4 p-4 bg-fucsia-50 rounded-2xl mb-6">
                <img src="${producto.imagen}" alt="${producto.nombre}" class="w-20 h-20 object-cover rounded-xl">
                <div>
                  <p class="font-display font-bold text-fucsia-900">${producto.nombre}</p>
                  <p class="text-xs text-gray-500">${UI.nombreCategoria(producto.categoria)}</p>
                </div>
              </div>

              <form id="resenaForm" class="space-y-5">
                <!-- Estrellas -->
                <div class="text-center">
                  <label class="form-label !text-base !mb-3">Tu calificación</label>
                  <div id="starPicker" class="flex gap-2 justify-center text-5xl cursor-pointer select-none">
                    ${[1,2,3,4,5].map(i => `<span class="star-btn text-gray-300 transition-transform hover:scale-110" data-value="${i}">★</span>`).join('')}
                  </div>
                  <p class="text-sm text-gray-600 mt-2" id="ratingLabel">Selecciona una calificación</p>
                </div>

                <div>
                  <label class="form-label" for="titulo">Título de tu reseña</label>
                  <input type="text" id="titulo" maxlength="80" required placeholder="Ej: ¡Increíble calidad!" class="input-field">
                </div>

                <div>
                  <label class="form-label" for="comentario">Cuéntanos tu experiencia</label>
                  <textarea id="comentario" required rows="5" minlength="20" placeholder="¿Qué fue lo que más te gustó? ¿Lo recomendarías?" class="input-field resize-none"></textarea>
                  <p class="text-xs text-gray-500 mt-1">Mínimo 20 caracteres</p>
                </div>

                <button type="submit" class="btn-primary w-full justify-center">
                  Publicar reseña
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                </button>
              </form>
            </div>
          `;

          let rating = 0;
          const stars = document.querySelectorAll('.star-btn');
          const label = document.getElementById('ratingLabel');
          const textos = ['', 'Muy malo 😞', 'Malo 😐', 'Regular 🙂', 'Bueno 😄', '¡Excelente! 🤩'];

          stars.forEach(star => {
            star.addEventListener('mouseenter', () => {
              const val = parseInt(star.dataset.value);
              stars.forEach((s, i) => {
                s.classList.toggle('text-yellow-400', i < val);
                s.classList.toggle('text-gray-300', i >= val);
              });
            });
            star.addEventListener('click', () => {
              rating = parseInt(star.dataset.value);
              stars.forEach((s, i) => {
                s.classList.toggle('text-yellow-400', i < rating);
                s.classList.toggle('text-gray-300', i >= rating);
              });
              label.textContent = textos[rating];
            });
          });

          document.getElementById('starPicker').addEventListener('mouseleave', () => {
            stars.forEach((s, i) => {
              s.classList.toggle('text-yellow-400', i < rating);
              s.classList.toggle('text-gray-300', i >= rating);
            });
          });

          document.getElementById('resenaForm').addEventListener('submit', (e) => {
            e.preventDefault();
            if (rating === 0) { UI.toast('Por favor selecciona una calificación', 'warning'); return; }

            const nuevaResena = {
              id: 'r' + Date.now(),
              productoId: producto.id,
              usuarioId: usuario.id,
              usuarioNombre: usuario.nombre,
              usuarioAvatar: 'https://picsum.photos/seed/avatar-maria/200/200',
              rating,
              titulo: document.getElementById('titulo').value.trim(),
              comentario: document.getElementById('comentario').value.trim(),
              fecha: new Date().toISOString()
            };
            const resenas = Storage.get(KEYS.RESENAS, []);
            resenas.push(nuevaResena);
            Storage.set(KEYS.RESENAS, resenas);

            UI.toast('¡Reseña publicada con éxito! ⭐', 'success');
            setTimeout(() => window.location.href = 'producto.html?id=' + producto.id, 1200);
          });
        }
      }
    }
  </script>
</body>
</html>
